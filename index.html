<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TradePulse</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#ffa028;min-height:100dvh;display:flex;align-items:center;
    justify-content:center;padding:24px;
    font:15px/1.5 -apple-system,'SF Pro Text',system-ui,sans-serif;
    padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .k{width:100%;max-width:380px;text-align:center}
  img{width:82px;height:82px;border-radius:19px;margin-bottom:18px}
  h1{font-size:19px;letter-spacing:1.5px;font-weight:700;color:#ffc400;margin-bottom:6px}
  .d{color:#96702a;font-size:13px;margin-bottom:24px}
  .sp{width:26px;height:26px;border:2px solid #3a2f14;border-top-color:#ffc400;
    border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}
  @keyframes s{to{transform:rotate(360deg)}}
  a.b{display:block;background:#0a2a6b;color:#ffc400;text-decoration:none;
    padding:15px;border-radius:9px;font-weight:700;letter-spacing:.5px;margin-top:8px}
  a.b:active{opacity:.75}
  .n{color:#6b5420;font-size:11.5px;margin-top:20px;line-height:1.6}
  .err{color:#ff6b61;font-size:13px;margin-top:14px;display:none}
</style>
</head>
<body>
<div class="k">
  <img src="icon-192.png" alt="">
  <h1>TRADEPULSE</h1>
  <div class="d">terminale yönlendiriliyor…</div>
  <div class="sp" id="sp"></div>
  <a class="b" id="git" href="#">TERMİNALİ AÇ</a>
  <div class="err" id="err">Terminal şu an kapalı görünüyor.<br>Mac açık ve internete bağlı olmalı.</div>
  <div class="n">
    Bu sayfa sadece güncel adrese yönlendirir.<br>
    Terminal ayrıca <b>şifre</b> ister — adresi bilen içeri giremez.
  </div>
</div>
<script>
// Adres tünel her yeniden başladığında buraya yazılır.
// Sayfanin kendisi CDN'de onbelleklenip ESKI adresle servis edilebiliyor:
// tunel her yeniden basladiginda adres degisiyor ve kullanici bayat bir
// kopyayi aliyordu. Bu yuzden adres calisma aninda, onbellek kirici ile
// ayrica cekiliyor; asagidaki sabit yalnizca yedek.
const ADRES_YEDEK = "https://charts-entered-positive-represents.trycloudflare.com";
let ADRES = ADRES_YEDEK;
const g   = document.getElementById('git');
const sp  = document.getElementById('sp');
const err = document.getElementById('err');
const d   = document.querySelector('.d');
g.href = ADRES;

// Bot düştüğünde launchd onu ~20 saniyede geri kaldırıyor. Tek deneyip pes
// etmek kullanıcıyı tam o pencerede duvara çarptırıyordu; artık ayağa
// kalkana kadar bekliyoruz.
const ARA_MS = 2500, SURE_MS = 90000;
let dene = 0, t0 = Date.now();

// Taze adresi bul: once raw.githubusercontent (Pages derlemesinden bagimsiz),
// sonra ayni site, sonunda gomulu yedek.
async function adresTazele(){
  const kaynaklar = [
    'https://raw.githubusercontent.com/ekcna/tp/main/adres.txt',
    'adres.txt',
  ];
  for(const u of kaynaklar){
    try{
      const r = await fetch(u + '?cb=' + Date.now(), {cache:'no-store'});
      if(!r.ok) continue;
      const t = (await r.text()).trim();
      if(/^https:\/\/[a-z0-9.-]+$/i.test(t)){
        if(t !== ADRES){ ADRES = t; g.href = ADRES; }
        return;
      }
    }catch(e){}
  }
}

function gec(){ location.replace(ADRES); }

async function bak(){
  dene++;
  await adresTazele();          // her denemede adresi yeniden dogrula
  try{
    await fetch(ADRES + '/health', {mode:'no-cors', cache:'no-store'});
    d.textContent = 'terminal ayakta — açılıyor…';
    err.style.display = 'none';
    setTimeout(gec, 350);
    return;
  }catch(e){}

  const kalan = Math.max(0, Math.round((SURE_MS - (Date.now() - t0)) / 1000));
  if(kalan === 0){
    sp.style.display = 'none';
    d.textContent = 'terminale ulaşılamadı';
    err.innerHTML = 'Terminal şu an kapalı görünüyor.<br>Mac açık ve internete bağlı olmalı.' +
      '<br><br><a href="#" id="tekrar" style="color:#ffc400">tekrar dene</a>';
    err.style.display = 'block';
    document.getElementById('tekrar').onclick = ev => {
      ev.preventDefault(); dene = 0; t0 = Date.now();
      sp.style.display = ''; err.style.display = 'none'; bak();
    };
    return;
  }
  d.textContent = 'terminal yanıt vermiyor — yeniden deneniyor (' + dene + ')';
  err.innerHTML = 'Bot yeniden başlıyor olabilir; bu genelde 20 saniye sürer.<br>' +
                  kalan + ' saniye daha denenecek.';
  err.style.display = 'block';
  setTimeout(bak, ARA_MS);
}
bak();
</script>
</body>
</html>
